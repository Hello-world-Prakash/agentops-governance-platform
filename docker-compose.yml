services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: agentops
      POSTGRES_USER: agentops
      POSTGRES_PASSWORD: agentops
    volumes:
      - agentops_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentops -d agentops"]
      interval: 10s
      timeout: 3s
      retries: 3

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://agentops:agentops@database:5432/agentops
      REDIS_URL: redis://redis:6379/0
      LOCAL_LLM_MODEL: ${LOCAL_LLM_MODEL:-llama3.2:3b}
    ports:
      - "8000:8000"
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://127.0.0.1:8000}
      NEXT_PUBLIC_AUTH_REQUIRED: ${NEXT_PUBLIC_AUTH_REQUIRED:-true}
      NEXT_PUBLIC_DEMO_ROLE: ${NEXT_PUBLIC_DEMO_ROLE:-Admin}
      AUTH_SECRET: ${AUTH_SECRET:-local-demo-auth-secret-change-before-enabling-sso}
      AUTH_DEFAULT_ROLE: ${AUTH_DEFAULT_ROLE:-Admin}
    ports:
      - "3000:3000"
    depends_on:
      - backend

  # Later production service:
  # ollama:
  #   image: ollama/ollama

volumes:
  agentops_postgres:
